<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JungBott 2026 – Mission 2040</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --line: #262d35;
    --text: #d8dde3;
    --muted: #7d8793;
    --accent: #d4a441;
    --ok: #3ecf8e;
    --err: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% -10%, #1c2229 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px 16px;
  }
  .vault {
    width: 100%; max-width: 560px;
    background: linear-gradient(180deg, #171c22, var(--panel));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 28px 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
    text-align: center;
    position: relative;
  }
  /* Kopfzeile */
  .brand {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: -8px -4px 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  .logo { width: 72px; height: 72px; flex: none; display: grid; place-items: center; }
  .logo img { display: block; width: 100%; height: 100%; object-fit: contain; opacity: .92; }
  .event {
    font: 700 13px/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
    text-align: right; white-space: nowrap;
  }
  .event span { font-size: 18px; letter-spacing: .06em; }
  .footer {
    margin: 18px 0 4px; width: 100%;
    text-align: center; font-size: 11px; letter-spacing: .08em; color: #4d5661;
  }

  /* Fortschritt: vier Fragmente */
  .progress { display: none; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
  .progress.on { display: flex; }
  .slot {
    width: 46px; height: 54px; border-radius: 10px;
    border: 1px solid var(--line); background: #0c0f12;
    display: grid; place-items: center;
    font: 700 22px/1 ui-monospace, Menlo, Consolas, monospace; color: #3a434d;
    transition: border-color .3s, color .3s, box-shadow .3s;
  }
  .slot.filled { color: var(--ok); border-color: #2f5f49; box-shadow: 0 0 14px rgba(62,207,142,.15); }
  .slot.active { border-color: var(--accent); }

  /* Inhalte */
  .kicker {
    font: 600 11px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .3em; text-transform: uppercase; color: var(--accent);
    margin: 0 0 10px;
  }
  h1 { font-size: 25px; margin: 0 0 12px; font-weight: 700; }
  .lead { color: var(--muted); margin: 0 0 22px; line-height: 1.55; font-size: 15px; }
  .lead strong { color: var(--text); font-weight: 600; }
  .story {
    text-align: left; background: #0c0f12; border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; margin: 0 0 22px;
    line-height: 1.6; font-size: 15px; color: var(--muted);
  }
  .dial {
    width: 78px; height: 78px; margin: 4px auto 20px;
    border-radius: 50%; border: 2px solid var(--line);
    background: conic-gradient(from 0deg, #1d232a, #0f1216, #1d232a, #0f1216, #1d232a);
    display: grid; place-items: center;
    transition: transform 1.2s cubic-bezier(.2,.8,.2,1), border-color .4s;
  }
  .dial::after {
    content: ""; width: 24px; height: 24px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--accent);
    box-shadow: 0 0 18px rgba(212,164,65,.35);
    transition: border-color .4s, box-shadow .4s;
  }
  .dial.open { transform: rotate(540deg); border-color: var(--ok); }
  .dial.open::after { border-color: var(--ok); box-shadow: 0 0 24px rgba(62,207,142,.5); }

  /* Eingaben und Knöpfe */
  input {
    width: 100%; background: #0c0f12; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 15px 14px;
    font: 600 22px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .6em; text-indent: .6em; text-align: center; text-transform: uppercase;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #3a434d; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212,164,65,.15); }
  input.one { max-width: 110px; margin: 0 auto; }
  button {
    background: var(--accent); color: #1a1406; border: 0; border-radius: 10px; padding: 14px 20px;
    font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer; transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: wait; }
  button.ghost {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    font-size: 13px; letter-spacing: .06em; padding: 11px 16px;
  }
  button.ghost:hover { color: var(--text); border-color: #3a434d; filter: none; }
  .row { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 18px; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 14px; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }

  /* Lösungs-Knopf */
  details.sol { margin-top: 20px; text-align: left; }
  details.sol summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 13px; letter-spacing: .06em;
    border: 1px dashed #3a434d; border-radius: 10px; padding: 10px 14px;
  }
  details.sol summary::-webkit-details-marker { display: none; }
  details.sol summary:hover { color: var(--text); border-color: var(--accent); }
  details.sol summary::before { content: "?"; font-weight: 700; color: var(--accent); }
  details.sol[open] summary { color: var(--text); border-style: solid; border-color: var(--accent); }
  details.sol[open] summary::before { content: "×"; }
  .sol-body {
    margin-top: 10px; background: #0c0f12; border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0;
    padding: 14px 16px; line-height: 1.6; font-size: 14px; color: var(--muted);
    animation: rise .35s ease-out both;
  }
  .sol-body b { color: var(--text); }

  /* Werkzeug (Binär-Übersetzer) */
  .tool {
    background: #0c0f12; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin: 0 0 20px; text-align: left;
  }
  .tool-label {
    display: block; margin-bottom: 10px;
    font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
  }
  .tool input {
    font-size: 16px; letter-spacing: .18em; text-indent: .18em; padding: 11px 12px;
    text-transform: none;
  }
  .tool-out {
    margin-top: 10px; font-size: 14px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; justify-content: space-between;
  }
  .tool-out b {
    font: 700 20px/1 ui-monospace, Menlo, Consolas, monospace;
    color: var(--ok); letter-spacing: .12em; word-break: break-all;
  }
  .hint {
    margin-top: 18px; text-align: left;
    background: #0c0f12; border: 1px dashed #3b4a42; border-radius: 10px;
    padding: 16px 18px; line-height: 1.55; white-space: pre-wrap;
  }
  .hint-label {
    display: block; margin-bottom: 8px;
    font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .2em; text-transform: uppercase; color: var(--ok);
  }
  .shake { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  #screen { animation: rise .4s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 420px) {
    .vault { padding: 24px 18px; }
    .slot { width: 40px; height: 48px; font-size: 19px; }
  }
</style>
</head>

      bin.value = bin.value.replace(/[^01 ]/g, "");
      const bits = bin.value.replace(/\s+/g, "");
      if (!bits) { out.textContent = "–"; return; }
      if (bits.length % 8 !== 0) { out.textContent = "… " + (8 - bits.length % 8) + " Bit fehlen"; return; }
      out.textContent = (bits.match(/.{8}/g) || [])
        .map(byte => String.fromCharCode(parseInt(byte, 2))).join("");
    });
  }

  if (i > 0) document.getElementById("back").onclick = () => { state.step = i - 1; save(); render(); };

  document.getElementById("next").onclick = () => {
    const v = input.value.toUpperCase().trim();
    if (!v) {
      msg.className = "msg err";
      msg.textContent = "Trag das gefundene Zeichen ein – oder schau bei der Lösung nach.";
      input.classList.add("shake"); setTimeout(() => input.classList.remove("shake"), 500);
      return;
    }
    if (v !== d(s.a)) {
      msg.className = "msg err";
      msg.textContent = "Das ist noch nicht das gesuchte Zeichen. Probier es nochmals oder öffne die Lösung.";
      input.classList.add("shake"); setTimeout(() => input.classList.remove("shake"), 500);
      return;
    }
    state.answers[i] = v;
    state.step = i + 1 < STEPS.length ? i + 1 : "final";
    save(); render();
  };
}

/* --- Schlusscode --- */
function renderFinal() {
  screenEl.innerHTML = `
    <div class="dial" aria-hidden="true"></div>
    <p class="kicker">Letzter Schritt</p>
    <h1>Der Tresor</h1>
    <p class="lead">Alle vier Fragmente sind gefunden. Setz sie zum Aktivierungscode zusammen und gib ihn ein.</p>
    <input id="code" maxlength="4" placeholder="&bull; &bull; &bull; &bull;" autocapitalize="characters" spellcheck="false">
    <div class="row">
      <button class="ghost" id="back" type="button">Zur&uuml;ck</button>
      <button id="btn" type="button">&Ouml;ffnen</button>
    </div>
    <p class="msg" id="msg"></p>`;

  const input = document.getElementById("code");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  let fails = 0;
  input.focus();
  input.addEventListener("input", () => {
    input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    msg.textContent = "";
  });
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); btn.click(); } });
  document.getElementById("back").onclick = () => { state.step = STEPS.length - 1; save(); render(); };

  btn.onclick = async () => {
    const code = input.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length !== 4) {
      msg.className = "msg err"; msg.textContent = "Der Code hat genau 4 Zeichen.";
      return;
    }
    if (code !== STEPS.map(s => d(s.a)).join("")) {        // falscher Code
      msg.className = "msg err";
      msg.textContent = ERROR_TEXTS[fails++ % ERROR_TEXTS.length];
      input.select();
      return;
    }
    btn.disabled = true; btn.textContent = "Prüfe …"; msg.textContent = "";
    state.message = await decryptMessage(code);           // richtig
    state.step = "done"; save(); render();
  };
}

/* Schlussmeldung entschlüsseln; klappt das nicht (alter Browser, kein https),
   wird die Ausweich-Meldung verwendet, damit der Tresor immer aufgeht. */
async function decryptMessage(code) {
  try {
    if (!window.crypto || !crypto.subtle) throw new Error("no webcrypto");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(VAULT.salt), iterations: 200000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(VAULT.iv) }, key, b64(VAULT.data));
    return new TextDecoder().decode(plain);
  } catch (err) {
    console.warn("Entschlüsselung nicht möglich, Ausweich-Meldung wird angezeigt:", err);
    return d(MESSAGE_FALLBACK);
  }
}

/* --- Geschafft --- */
function renderDone(message) {
  screenEl.innerHTML = `
    <div class="dial open" aria-hidden="true"></div>
    <p class="kicker" style="color:var(--ok)">Entsperrt</p>
    <h1>Richtig!</h1>
    <p class="lead" style="margin-bottom:0">Der Tresor ist offen. Gut gemacht.</p>
    <div class="hint"><span class="hint-label">Meldung</span>${esc(message)}</div>
    <div class="row"><button class="ghost" id="reset">Für die nächste Gruppe neu starten</button></div>`;
  document.getElementById("reset").onclick = () => {
    state = { step: "intro", answers: ["", "", "", ""] };
    save(); render();
  };
}

render();
</script>
